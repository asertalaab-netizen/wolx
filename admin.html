<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم والمبيعات - WORX Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; }
        body { background: #050505; color: #fff; padding: 15px; }
        .admin-box { max-width: 1100px; margin: 0 auto 30px; background: #0D0D0D; border: 1px solid #262626; padding: 20px; border-radius: 12px; }
        h2 { margin-bottom: 15px; font-weight: 900; color: #fff; text-align: center; border-bottom: 1px solid #262626; padding-bottom: 10px; font-size: 18px; }
        label { display: block; margin-bottom: 5px; color: #A3A3A3; font-size: 12px; }
        input, select, textarea { width: 100%; background: #151515; border: 1px solid #262626; color: #fff; padding: 10px; border-radius: 6px; margin-bottom: 12px; outline: none; font-size: 13px; }
        input[type="file"] { background: #1a1a1a; padding: 8px; cursor: pointer; border: 1px dashed #444; }
        button { background: #25D366; color: white; border: none; padding: 12px; width: 100%; font-weight: 700; font-size: 14px; border-radius: 6px; cursor: pointer; transition: 0.3s; }
        button:disabled { background: #555; cursor: not-allowed; }
        
        .table-responsive { overflow-x: auto; }
        .data-table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 600px; }
        .data-table th, .data-table td { border: 1px solid #262626; padding: 10px; text-align: right; font-size: 12px; vertical-align: top; }
        .data-table th { background: #151515; color: #fff; }
        .delete-btn { background: #ff4d4d; color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; }
    </style>
</head>
<body>

    <!-- سجل المبيعات -->
    <div class="admin-box">
        <h2>سجل المبيعات والطلبات الواردة</h2>
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>التاريخ</th>
                        <th>الاسم</th>
                        <th>الهاتف</th>
                        <th>المحافظة</th>
                        <th>العنوان</th>
                        <th>الطلبات</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody id="ordersList"></tbody>
            </table>
        </div>
    </div>

    <!-- إضافة منتج مع رفع الصور من المعرض -->
    <div class="admin-box">
        <h2>إضافة منتج جديد (رفع الصور من المعرض)</h2>
        <form id="addProductForm">
            <label>اسم المنتج:</label>
            <input type="text" id="title" placeholder="WORX Oversized Hoodie – Black" required>

            <label>السعر:</label>
            <input type="text" id="price" placeholder="LE 950" required>

            <label>الصورة الرئيسية (من معرض الصور):</label>
            <input type="file" id="file_1" accept="image/*" required>

            <label>الصورة الثانية (اختياري - من المعرض):</label>
            <input type="file" id="file_2" accept="image/*">

            <label>الصورة الثالثة (اختياري - من المعرض):</label>
            <input type="file" id="file_3" accept="image/*">

            <label>القسم:</label>
            <select id="category">
                <option value="polo">تشكيلة البولو (Polo)</option>
                <option value="round">تشكيلة الراوند (Round Neck)</option>
                <option value="hoodie">تشكيلة الهودي (Hoodies)</option>
            </select>

            <label>الوصف:</label>
            <textarea id="description" rows="2" placeholder="وصف وخامة المنتج..."></textarea>

            <button type="submit" id="submitBtn">رفع الصور وإضافة المنتج فوراً</button>
        </form>
    </div>

    <!-- إدارة المنتجات -->
    <div class="admin-box">
        <h2>إدارة المنتجات (حذف)</h2>
        <div class="table-responsive">
            <table class="data-table">
                <thead>
                    <tr>
                        <th>اسم المنتج</th>
                        <th>القسم</th>
                        <th>السعر</th>
                        <th>إجراء</th>
                    </tr>
                </thead>
                <tbody id="adminProductsList"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const supabaseUrl = 'https://vhizqkodylhobljpetgu.supabase.co';
        const supabaseKey = 'sb_publishable_WC10R2Y80AB_rRMO4kQsXg_ZKYB8aBn';
        const supabase = createClient(supabaseUrl, supabaseKey);

        // دالة رفع الملف لـ Supabase Storage واسترجاع الرابط
        async function uploadImage(fileInput) {
            if (!fileInput.files || fileInput.files.length === 0) return null;
            const file = fileInput.files[0];
            const fileExt = file.name.split('.').pop();
            const fileName = `${Date.now()}_${Math.random().toString(36).substring(7)}.${fileExt}`;

            const { data, error } = await supabase.storage.from('products').upload(fileName, file);
            if (error) {
                console.error('خطأ رفع الصورة:', error);
                return null;
            }

            const { data: publicUrlData } = supabase.storage.from('products').getPublicUrl(fileName);
            return publicUrlData.publicUrl;
        }

        async function loadOrders() {
            let { data: orders, error } = await supabase.from('orders').select('*').order('created_at', { ascending: false });
            const tbody = document.getElementById('ordersList');
            if (!tbody) return;
            tbody.innerHTML = '';
            if (error || !orders) return;

            orders.forEach(order => {
                const dateStr = new Date(order.created_at).toLocaleDateString('ar-EG');
                tbody.innerHTML += `
                    <tr>
                        <td>${dateStr}</td>
                        <td><b>${order.customer_name}</b></td>
                        <td>${order.customer_phone}</td>
                        <td>${order.customer_city}</td>
                        <td>${order.customer_address}</td>
                        <td style="white-space: pre-line;">${order.items_details}</td>
                        <td><button class="delete-btn" onclick="deleteOrder(${order.id})">حذف</button></td>
                    </tr>
                `;
            });
        }

        async function loadAdminProducts() {
            let { data: products, error } = await supabase.from('products').select('*');
            const tbody = document.getElementById('adminProductsList');
            if (!tbody) return;
            tbody.innerHTML = '';
            if (error || !products) return;

            products.forEach(product => {
                tbody.innerHTML += `
                    <tr>
                        <td>${product.title}</td>
                        <td>${product.category}</td>
                        <td>${product.price}</td>
                        <td><button class="delete-btn" onclick="deleteProduct(${product.id})">حذف</button></td>
                    </tr>
                `;
            });
        }

        document.getElementById('addProductForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'جاري رفع الصور ونشر المنتج...';

            const title = document.getElementById('title').value;
            const price = document.getElementById('price').value;
            const category = document.getElementById('category').value;
            const description = document.getElementById('description').value;

            // رفع الصور المحددة من الموبايل/الكمبيوتر
            const img1 = await uploadImage(document.getElementById('file_1'));
            const img2 = await uploadImage(document.getElementById('file_2'));
            const img3 = await uploadImage(document.getElementById('file_3'));

            if (!img1) {
                alert('فشل رفع الصورة الرئيسية، يرجى التأكد من إنشاء الـ Bucket باسم products في Supabase.');
                btn.disabled = false;
                btn.innerText = 'رفع الصور وإضافة المنتج فوراً';
                return;
            }

            const { error } = await supabase.from('products').insert([{
                title,
                price,
                image_url: img1,
                image_url_2: img2,
                image_url_3: img3,
                category,
                description
            }]);

            if (error) {
                alert('حدث خطأ أثناء الإضافة: ' + error.message);
            } else {
                alert('تم رفع الصور وإضافة المنتج بنجاح!');
                document.getElementById('addProductForm').reset();
                loadAdminProducts();
            }

            btn.disabled = false;
            btn.innerText = 'رفع الصور وإضافة المنتج فوراً';
        });

        window.deleteProduct = async function(id) {
            if (confirm('حذف هذا المنتج؟')) {
                await supabase.from('products').delete().eq('id', id);
                loadAdminProducts();
            }
        };

        window.deleteOrder = async function(id) {
            if (confirm('حذف هذا الطلب؟')) {
                await supabase.from('orders').delete().eq('id', id);
                loadOrders();
            }
        };

        window.addEventListener('DOMContentLoaded', () => {
            loadOrders();
            loadAdminProducts();
        });
    </script>
</body>
</html>
